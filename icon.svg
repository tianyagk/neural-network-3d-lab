<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Neural Network 3D Lab">
  <defs>
    <linearGradient id="nn3Front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63e0d6"/>
      <stop offset="1" stop-color="#1f8f9c"/>
    </linearGradient>
    <linearGradient id="nn3Mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa8ff"/>
      <stop offset="1" stop-color="#2f4df0"/>
    </linearGradient>
    <linearGradient id="nn3Out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e3922c"/>
    </linearGradient>
    <linearGradient id="nn3Top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfe9ff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- input volume: a gridded feature map -->
  <g>
    <path d="M8 26 L22 26 L26 22 L12 22 Z" fill="url(#nn3Top)"/>
    <path d="M22 26 L26 22 L26 44 L22 48 Z" fill="url(#nn3Top)"/>
    <rect x="8" y="26" width="14" height="22" rx="1.5" fill="url(#nn3Front)"/>
    <g stroke="#04202a" stroke-opacity="0.55" stroke-width="0.7">
      <path d="M8 33.3 H22 M8 40.7 H22 M12.7 26 V48 M17.3 26 V48"/>
    </g>
  </g>

  <!-- hidden volume: deeper channel stack -->
  <g>
    <path d="M30 20 L42 20 L47 15 L35 15 Z" fill="url(#nn3Top)"/>
    <path d="M42 20 L47 15 L47 33 L42 38 Z" fill="url(#nn3Top)"/>
    <rect x="30" y="20" width="12" height="18" rx="1.5" fill="url(#nn3Mid)"/>
    <g stroke="#0a1740" stroke-opacity="0.6" stroke-width="0.7">
      <path d="M30 26 H42 M30 32 H42 M35.6 20 V38 M39.2 20 V38"/>
    </g>
  </g>

  <!-- output volume -->
  <g>
    <path d="M49 16 L57 16 L60 13 L52 13 Z" fill="url(#nn3Top)"/>
    <path d="M57 16 L60 13 L60 24 L57 27 Z" fill="url(#nn3Top)"/>
    <rect x="49" y="16" width="8" height="11" rx="1.2" fill="url(#nn3Out)"/>
  </g>

  <!-- data flow -->
  <g stroke="#8fd6ff" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M23 34 C26 33 27 31 30 29"/>
    <path d="M43 27 C45 24 46 21 49 20"/>
  </g>
  <g fill="#dff1ff">
    <circle cx="23.5" cy="33.6" r="1.35"/>
    <circle cx="30" cy="29" r="1.35"/>
    <circle cx="43" cy="27" r="1.2"/>
    <circle cx="49" cy="20" r="1.2"/>
  </g>
</svg>
